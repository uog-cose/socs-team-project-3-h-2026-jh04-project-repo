name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  
  push:
    branches: [main]
    paths: 
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults: 
      run:
        working-directory: backend
      
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with: 
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Lint
        run: ruff check .

      - name: Test
        # Coverage of app/ is printed in the log and added to the run's summary page.
        run: pytest --cov=app --cov-report=term-missing --cov-report=markdown-append:"$GITHUB_STEP_SUMMARY"






